<section class="section contact" id="contactos" aria-labelledby="contact-title">
  <div class="container">
    <div class="contact-heading">
      <p class="eyebrow">Fale connosco</p>
      <h2 id="contact-title">Peça informações ou marque uma avaliação</h2>
    </div>
    <div class="contact-layout">
    <form
      class="contact-form"
      id="contact-form"
      novalidate
      data-whatsapp="{{ site.data.business.whatsapp_number }}"
      data-email="{{ site.data.business.email }}"
      data-email-endpoint="https://formsubmit.co/ajax/{{ site.data.business.email }}"
    >
      <div class="form-honeypot" aria-hidden="true" hidden>
        <label for="website">Deixe este campo vazio</label>
        <input
          id="website"
          name="_honey"
          type="text"
          tabindex="-1"
          autocomplete="off"
        />
      </div>
      <div class="form-row">
        <label for="name">Nome <span aria-hidden="true">*</span></label>
        <input id="name" name="name" type="text" autocomplete="name" required />
      </div>
      <fieldset>
        <legend>
          Forma preferida de contacto <span aria-hidden="true">*</span>
        </legend>
        <label class="radio"
          ><input
            type="radio"
            name="contact_method"
            value="WhatsApp"
            required
            checked
          />
          WhatsApp</label
        >
        <label class="radio"
          ><input type="radio" name="contact_method" value="Email" required />
          Email</label
        >
      </fieldset>
      <div class="form-two">
        <div class="form-row">
          <label for="phone"
            >WhatsApp ou telefone <span aria-hidden="true">*</span></label
          >
          <input
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            required
          />
        </div>
        <div class="form-row">
          <label for="email">Email <span aria-hidden="true">*</span></label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>
      </div>
      <div class="form-row">
        <label for="subject"
          >Tratamento ou preocupação <span aria-hidden="true">*</span></label
        >
        <select id="subject" name="subject" required>
          <option value="">Selecione uma opção</option>
          {% for treatment in site.data.treatments %}
          <option>{{ treatment.name }}</option>
          {% endfor %} {% for problem in site.data.problems %}
          <option>{{ problem.name }}</option>
          {% endfor %}
          <option>Outra questão</option>
        </select>
      </div>
      <div class="form-row">
        <label for="message">Mensagem <span aria-hidden="true">*</span></label>
        <textarea
          id="message"
          name="message"
          rows="5"
          required
          maxlength="1000"
        ></textarea>
      </div>
      <label class="privacy-check">
        <input id="privacy" name="privacy" type="checkbox" required />
        <span
          >Li a
          <a href="{{ '/legal/politica-de-privacidade/' | relative_url }}"
            >Política de Privacidade</a
          >
          e compreendo como os meus dados serão utilizados para responder ao meu
          pedido. <span aria-hidden="true">*</span></span
        >
      </label>
      <div
        class="form-status form-toast"
        id="form-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
      >
        <span data-form-status-message></span>
        <button
          class="form-toast-close"
          type="button"
          aria-label="Fechar notificação"
        >
          ×
        </button>
      </div>
      <button class="button" type="submit">Continuar</button>
    </form>
      <aside
        class="contact-location"
        id="localizacao"
        aria-label="Onde estamos"
      >
        <div class="contact-location__details">
          <p class="eyebrow">Onde estamos</p>
          <address>{{ site.data.business.address }}</address>
          <p><strong>Horário:</strong> {{ site.data.business.schedule }}</p>
          <p>{{ site.data.business.appointments }}</p>
          <a
            class="button button-outline"
            href="{{ site.data.business.maps_url }}"
            target="_blank"
            rel="noopener noreferrer"
            >Obter direções</a
          >
        </div>
        <div class="map-shell">
          <iframe
            src="{{ site.data.business.maps_embed_url }}"
            title="Mapa da localização da Ryca Beauty"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen
          ></iframe>
        </div>
      </aside>
    </div>
  </div>
</section>

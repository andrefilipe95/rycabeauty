{% unless page.url == '/' %}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ '/' | relative_url }}">Início</a></li>
    {% if page.section_url and page.section_name %}
      <li><a href="{{ page.section_url | relative_url }}">{{ page.section_name }}</a></li>
    {% endif %}
    <li aria-current="page">{{ page.title }}</li>
  </ol>
</nav>
{% endunless %}

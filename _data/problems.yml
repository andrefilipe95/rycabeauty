- slug: acne-e-pele-acneica
  name: Acne e pele com tendência acneica
  summary: Borbulhas, pontos negros, oleosidade e marcas podem surgir em diferentes zonas da pele.
  image: /assets/images/problemas/acne-pele-acneica-v2.webp

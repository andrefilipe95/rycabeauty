  featured: false
- slug: pele-baca-e-falta-de-luminosidade
  name: Pele baça e falta de luminosidade
  summary: Rotina, desidratação e acumulação de células à superfície podem contribuir para uma aparência menos luminosa.
  image: /assets/images/problemas/pele-baca-luminosidade-v2.webp
  alt: Retrato com pele de acabamento natural e luminosidade reduzida
  featured: false

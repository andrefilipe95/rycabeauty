- slug: manchas-e-hiperpigmentacao
  name: Manchas e hiperpigmentação
  summary: As manchas podem criar diferenças de tonalidade e tornar a pele visualmente menos uniforme.
  image: /assets/images/problemas/manchas-hiperpigmentacao-v2.webp
  alt: Retrato com alterações de pigmentação visíveis na face
  featured: true
- slug: pele-oleosa
  name: Pele oleosa
  summary: Brilho excessivo, sensação oleosa e poros mais visíveis podem surgir em diferentes zonas do rosto.
  image: /assets/images/problemas/pele-oleosa-v2.webp
  alt: Retrato com brilho natural mais visível na zona T do rosto
  featured: false
- slug: pontos-negros-e-poros-obstruidos
  name: Pontos negros, poros visíveis e obstruídos
  summary: A acumulação de sebo e células à superfície pode tornar os poros mais visíveis.
  image: /assets/images/problemas/poros-obstruidos-v2.webp
  alt: Pormenor da zona do nariz e da face com poros visíveis
  featured: true
- slug: pelos-indesejados-e-encravados
  name: Pelos indesejados e pelos encravados
  summary: O crescimento frequente do pelo e a irritação causada pela remoção podem provocar desconforto em diferentes zonas.
  image: /assets/images/problemas/pelos-indesejados-encravados-v2.webp

  featured: true
- slug: marcas-de-acne
  name: Marcas de acne e irregularidades da pele
  summary: As marcas de acne podem deixar diferenças de cor ou tornar a textura da pele menos uniforme.
  image: /assets/images/problemas/marcas-acne-v2.webp
  alt: Retrato com marcas de acne estabilizadas e pequenas irregularidades
  featured: true
- slug: textura-irregular
  name: Textura irregular
  summary: Aspereza e pequenas irregularidades podem tornar a pele menos uniforme ao olhar e ao toque.
  image: /assets/images/problemas/textura-irregular-v2.webp
  alt: Perfil facial com pequenas diferenças de textura na pele
  featured: false
- slug: flacidez-facial
  name: Flacidez facial
  summary: A perda gradual de firmeza pode tornar-se mais visível no contorno facial, nas bochechas e no pescoço.
  image: /assets/images/problemas/flacidez-facial-v2.webp
